[package]
name = "ak-proto"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AK Studio の入口（画面・HTTP・MCP）をまたぐ型。TypeScript の型と JSON Schema の元になる"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
ts-rs = { version = "12", features = ["serde-json-impl"] }
